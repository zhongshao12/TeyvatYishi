name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install existing Tauri dependencies for real file contract tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck:index-safety
      - name: Build native transport and run Rust tests before offline JS contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: pnpm test:unit:coverage
      - run: pnpm test:release
      - run: pnpm test:bundle-size
      - run: pnpm test:all
      - name: Share verified frontend with desktop check
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: dist
          if-no-files-found: error
          retention-days: 3

  desktop-rust:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore verified frontend
        uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: dist
      - name: Compile desktop Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
